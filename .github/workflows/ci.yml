name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PlatformIO
        run: pipx install platformio==6.1.19
      - name: Build every firmware environment
        run: pio run
  parser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test untrusted input with memory and undefined-behavior sanitizers
        run: |
          clang++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined -Iinclude tests/protocol_validation_test.cpp -o /tmp/protocol-tests
          /tmp/protocol-tests
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks with release checksum verification
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          scan_dir=$(mktemp -d)
          cd "$scan_dir"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location "$base/$archive" -o "$archive"
          curl --fail --silent --show-error --location "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          awk -v archive="$archive" '$2 == archive {print}' checksums.txt > selected-checksum.txt
          test -s selected-checksum.txt
          sha256sum --check selected-checksum.txt
          tar -xzf "$archive" gitleaks
          echo "$scan_dir" >> "$GITHUB_PATH"
      - run: gitleaks git . --log-opts="--all" --redact
